# VTKE Configuration: Debug Preset
# Best for: Troubleshooting, algorithm tuning
# Trade-off: Large output, detailed artifacts

video:
  extraction_fps: 4.0
  sharpness_min: 25.0
  min_text_length: 30
  jaccard_k: 20
  overlap_threshold: 0.60
  min_unique_lines: 1
  save_frames: true  # Save all frames for inspection
  ocr_engine: "tesseract"
  language_hint: "eng"
  max_frames: 500    # Limit for debugging
  blackframe_threshold: 20.0

assets:
  mode: "detect"
  dry_run: true

mdx:
  include_lang: []
  exclude_lang: []
  min_block_lines: 1  # More lenient
  max_block_chars: 100000
