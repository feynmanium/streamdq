# VTKE Configuration: Fast Preset
# Best for: Quick scans, low-priority content
# Trade-off: Faster processing, may miss some content

video:
  extraction_fps: 3.0
  sharpness_min: 30.0
  min_text_length: 80
  jaccard_k: 15
  overlap_threshold: 0.70
  min_unique_lines: 3
  save_frames: false
  ocr_engine: "tesseract"
  language_hint: "eng"
  max_frames: null
  blackframe_threshold: 20.0

assets:
  mode: "detect"
  dry_run: true

mdx:
  include_lang: []
  exclude_lang: []
  min_block_lines: 2
  max_block_chars: 100000
